[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
extra_output = ["storageLayout"]
ffi = false
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./out" },
]
fuzz = { runs = 10_000, max_test_rejects = 65_536 }
invariant = { runs = 1_000, depth = 128, fail_on_revert = true }

[profile.non_ir]
via_ir = false

[profile.ci]
verbosity = 2
fuzz = { runs = 10_000, max_test_rejects = 65_536 }
invariant = { runs = 1_000, depth = 128, fail_on_revert = true }

[profile.nightly]
fuzz = { runs = 100_000, max_test_rejects = 65_536 }
invariant = { runs = 10_000, depth = 256, fail_on_revert = true }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }
