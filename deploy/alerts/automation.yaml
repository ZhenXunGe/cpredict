groups:
  - name: cpredict-automation
    rules:
      - alert: CpredictAutomaticClaimsQueued
        expr: cpredict_automation_blocked{reason=~"daily_gas_budget_exhausted|per_transaction_gas_cap_exceeded|gas_balance_insufficient|submission_rpc_unavailable"} > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Automatic work is queued because the keeper gas cap, budget, balance or submission endpoint is unavailable"
      - alert: CpredictAutomationOutcomeUnknown
        expr: cpredict_automation_blocked{reason="checking_original_transaction"} > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Query the saved transaction hash; never clear its journal or resend with a new nonce"
      - alert: CpredictAutomationFinalizedReorg
        expr: cpredict_automation_blocked{reason="rechecking_after_reorg"} > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "A previously finalized automation transaction left the canonical chain and is being rediscovered"
      - alert: CpredictAutomationChainCheckFailed
        expr: increase(cpredict_automation_ticks_total{result="error"}[5m]) > 2
        labels: { severity: warning }
        annotations:
          summary: "Automatic matching or rights processing cannot complete a chain check"
      - alert: CpredictAutomationActionStuckOnChainCheck
        expr: cpredict_automation_blocked{reason="retry_after_chain_check"} > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "An automatic action repeatedly fails chain preparation; inspect the market and original action before further Gas spending"
      - alert: CpredictConfirmedPayoutMissingFact
        expr: cpredict_automation_confirmed_missing_facts > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "A canonical confirmed automatic payout has no matching indexed financial fact; verify the original receipt and repair the projection without resending the transaction"
      - alert: CpredictSponsoredCleanupQuotaReached
        expr: increase(cpredict_automation_cleanup_quota_denials_total[5m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "Sponsored order cleanup reached an account or market quota; manual cancellation and claims remain available"
