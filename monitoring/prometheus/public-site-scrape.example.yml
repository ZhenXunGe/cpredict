# Add these jobs to the existing host Prometheus configuration. Enable the USDC
# job only after that environment is configured. Ports remain loopback-only.
scrape_configs:
  - job_name: cpredict-app-ctusd
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ['127.0.0.1:8795']
        labels:
          environment: ctusd-public-test
