name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  solidity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { submodules: false }
      - name: Bootstrap pinned Foundry
        run: bash scripts/bootstrap-foundry.sh
      - name: Bootstrap pinned dependencies
        run: bash scripts/bootstrap-deps.sh
      - name: Format
        run: bash scripts/forge.sh fmt --check
      - name: Build and test
        run: bash scripts/test-all.sh
      - name: Non-IR differential build and tests
        run: bash scripts/test-non-ir.sh
      - name: Contract sizes
        # EIP-170/EIP-3860 release gates apply to deployable production contracts, not
        # deliberately oversized Echidna/SMT harness initcode under test/security.
        run: bash scripts/forge.sh build src --sizes
      - name: Production gas and size gates
        run: bash scripts/gas-gates.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Regenerate deterministic artifacts
        run: npm run generate:artifacts
      - name: Check generated artifacts
        run: npm run check:artifacts
      - name: Reject stale generated artifacts
        run: >-
          git diff --exit-code -- generated manifests/source-manifest.json
          manifests/sbom.spdx.json manifests/licenses.json manifests/third-party-notices.md

  offchain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_USER: cpredict_ci
          POSTGRES_PASSWORD: cpredict_ci
          POSTGRES_DB: cpredict_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpredict_ci -d cpredict_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://cpredict_ci:cpredict_ci@127.0.0.1:5432/cpredict_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Materialize locked authoritative requirements
        env:
          CPREDICT_REQUIREMENTS_SOURCE_B64: ${{ secrets.CPREDICT_REQUIREMENTS_SOURCE_B64 }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { join } from "node:path";
            const encoded = process.env.CPREDICT_REQUIREMENTS_SOURCE_B64 ?? "";
            if (encoded.length === 0 || encoded.length % 4 !== 0 || !/^[A-Za-z0-9+/]*={0,2}$/.test(encoded)) {
              throw new Error("CPREDICT_REQUIREMENTS_SOURCE_B64 is missing or invalid");
            }
            const source = Buffer.from(encoded, "base64");
            if (source.length === 0) throw new Error("decoded requirements source is empty");
            writeFileSync(join(process.env.RUNNER_TEMP, "product-framework.md"), source, { mode: 0o600 });
          '
      - name: Requirements checker unit tests
        run: npm run test:requirements
      - name: Locked atomic requirements gate
        run: npm run check:requirements -- --source "$RUNNER_TEMP/product-framework.md"
      - name: Release and PostgreSQL gate unit tests
        run: npm run test:release-tools
      - name: Deterministic SBOM and license inventory
        run: |
          npm run test:sbom
          npm run check:sbom
      - name: Load and deployment evidence parser tests
        run: |
          npm run test:load-tools
          npm run test:deployment-tools
          npm run test:stack-tools
      - name: Node and shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find scripts -type f -name '*.mjs' -print0)
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find scripts -type f -name '*.sh' -print0)
      - run: npm run test:gate-parsers
      - run: npm run scan:secrets
      - run: npm run check:offchain
      - name: Web Demo build and bundle secret scan
        run: |
          npm run demo:test
          npm run demo:build
          npm run scan:demo-bundle
      - name: Compose static config and image builds
        run: |
          docker compose -f compose.yaml config --no-interpolate --quiet
          docker build --file deploy/compose/Dockerfile.offchain --target indexer --tag cpredict-indexer:ci .
          docker build --file deploy/compose/Dockerfile.offchain --target paymaster --tag cpredict-paymaster:ci .
          docker build --file deploy/compose/Dockerfile.demo --tag cpredict-web-demo:ci .
      - name: Scan container images for fixable high-severity vulnerabilities
        run: |
          bash scripts/security/bootstrap-trivy.sh
          npm run scan:container-config
          npm run scan:container-images
      - name: Full offchain tests with PostgreSQL available
        run: npm run test:offchain -- --maxWorkers=1
      - name: PostgreSQL integration zero-skip gate
        run: npm run test:postgres
      - run: npm run check:artifacts
      - run: npm audit --omit=dev --audit-level=high
